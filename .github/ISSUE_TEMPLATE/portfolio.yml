name: Ошибка или предложение для портфолио
description: Неработающая ссылка, неточность или предложение по описанию проекта
title: '[Портфолио] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Что нужно изменить?
      description: Укажите раздел или ссылку и опишите проблему.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
  - type: textarea
    id: evidence
    attributes:
      label: Подтверждение
      description: Ссылка на репозиторий или скриншот. Не прикладывайте секреты.
